name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build & test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null
          $log = "ci-logs/build.txt"
          "ShikkhaDesk CI run $env:GITHUB_RUN_NUMBER" | Out-File $log -Encoding utf8
          "OS: " + [System.Environment]::OSVersion.VersionString | Out-File -Append $log -Encoding utf8
          "Date(UTC): " + (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") | Out-File -Append $log -Encoding utf8
          "=== dotnet SDKs ===" | Out-File -Append $log -Encoding utf8
          (dotnet --list-sdks) | Out-File -Append $log -Encoding utf8

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ShikkhaDesk.sln 2>&1 | Tee-Object -FilePath ci-logs/restore.txt
          "RESTORE_EXIT=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          dotnet build ShikkhaDesk.sln -c Release --no-restore 2>&1 | Tee-Object -FilePath ci-logs/compile.txt
          "BUILD_EXIT=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8
          Write-Host "BUILD_EXIT=$LASTEXITCODE"

      - name: Test
        shell: pwsh
        run: |
          if (Test-Path "tests") {
            $testProjects = Get-ChildItem -Path tests -Filter *.csproj -Recurse
            if ($testProjects.Count -gt 0) {
              foreach ($p in $testProjects) {
                dotnet test $p.FullName -c Release --no-build --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath ci-logs/test-$($p.BaseName).txt
                "TEST_EXIT($($p.BaseName))=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8
              }
            } else { "TEST_EXIT=skipped (no test projects)" | Out-File -Append ci-logs/build.txt -Encoding utf8 }
          } else { "TEST_EXIT=skipped (no tests dir)" | Out-File -Append ci-logs/build.txt -Encoding utf8 }

      - name: Summarise
        if: always()
        shell: pwsh
        run: |
          $log = "ci-logs/build.txt"
          "=== errors ===" | Out-File -Append $log -Encoding utf8
          if (Test-Path ci-logs/compile.txt) {
            $errors = Select-String -Path ci-logs/compile.txt -Pattern ": error " |
              ForEach-Object { $_.Line } | Select-Object -Unique
            "ERROR_COUNT=$($errors.Count)" | Out-File -Append $log -Encoding utf8
            $errors | Select-Object -First 200 | ForEach-Object { $_ } | Out-File -Append $log -Encoding utf8
          }
          "=== warnings (first 20) ===" | Out-File -Append $log -Encoding utf8
          if (Test-Path ci-logs/compile.txt) {
            Select-String -Path ci-logs/compile.txt -Pattern ": warning " | Select-Object -First 20 |
              ForEach-Object { $_.Line } | Out-File -Append $log -Encoding utf8
          }
          "=== test summary ===" | Out-File -Append $log -Encoding utf8
          Get-ChildItem ci-logs -Filter test-*.txt -ErrorAction SilentlyContinue | ForEach-Object {
            (Select-String -Path $_.FullName -Pattern "Passed!|Failed!|error") | Select-Object -First 20 |
              ForEach-Object { $_.Line } | Out-File -Append $log -Encoding utf8
          }
          Get-Content $log | Write-Host

      - name: Publish results to PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'ci-logs/build.txt';
            let body = '';
            try { body = fs.readFileSync(p, 'utf8'); } catch (e) { body = 'no build log: ' + e.message; }
            if (body.length > 60000) body = body.slice(0, 60000) + '\n... (truncated)';
            const marker = '<!-- shikkhadesk-ci-report -->';
            const text = marker + '\n### ShikkhaDesk Windows CI — run ' + context.runId +
              '\n```\n' + body + '\n```';
            const comments = await github.rest.issues.listComments({
              issue_number: 1, owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: text
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: 1, owner: context.repo.owner, repo: context.repo.repo, body: text
              });
            }
