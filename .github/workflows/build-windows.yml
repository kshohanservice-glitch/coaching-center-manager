name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

jobs:
  build:
    name: Build & test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ci-logs" | Out-Null
          $log = "ci-logs/build.txt"
          "ShikkhaDesk CI run $env:GITHUB_RUN_NUMBER" | Out-File $log -Encoding utf8
          "OS: " + [System.Environment]::OSVersion.VersionString | Out-File -Append $log -Encoding utf8
          "Date(UTC): " + (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") | Out-File -Append $log -Encoding utf8
          "=== dotnet SDKs ===" | Out-File -Append $log -Encoding utf8
          (dotnet --list-sdks) | Out-File -Append $log -Encoding utf8

      - name: Check presentation layer
        shell: pwsh
        run: |
          python scripts/check-presentation.py 2>&1 | Tee-Object -FilePath ci-logs/presentation.txt
          "PRESENTATION_EXIT=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8
          exit $LASTEXITCODE

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore ShikkhaDesk.sln 2>&1 | Tee-Object -FilePath ci-logs/restore.txt
          "RESTORE_EXIT=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          dotnet build ShikkhaDesk.sln -c Release --no-restore 2>&1 | Tee-Object -FilePath ci-logs/compile.txt
          "BUILD_EXIT=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8
          Write-Host "BUILD_EXIT=$LASTEXITCODE"

      - name: Test
        timeout-minutes: 15
        shell: pwsh
        run: |
          if (Test-Path "tests") {
            $testProjects = Get-ChildItem -Path tests -Filter *.csproj -Recurse
            if ($testProjects.Count -gt 0) {
              foreach ($p in $testProjects) {
                dotnet test $p.FullName -c Release --no-build --logger "console;verbosity=detailed" 2>&1 | Tee-Object -FilePath ci-logs/test-$($p.BaseName).txt
                "TEST_EXIT($($p.BaseName))=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8
              }
            } else { "TEST_EXIT=skipped (no test projects)" | Out-File -Append ci-logs/build.txt -Encoding utf8 }
          } else { "TEST_EXIT=skipped (no tests dir)" | Out-File -Append ci-logs/build.txt -Encoding utf8 }

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path Directory.Build.props -Pattern "<Version>(.+)</Version>").Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -Append ci-logs/build.txt -Encoding utf8
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Publish application
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet publish src\ShikkhaDesk.Wpf\ShikkhaDesk.Wpf.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false -p:PublishTrimmed=false -o artifacts\app 2>&1 | Tee-Object -FilePath ci-logs/publish.txt
          "PUBLISH_EXIT=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8
          "PUBLISH_EXIT=$LASTEXITCODE" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Package portable release
        if: env.PUBLISH_EXIT == '0'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release | Out-Null
          $zip = "artifacts\release\ShikkhaDesk-Release-v$env:VERSION-x64.zip"
          Copy-Item -Path docs -Destination artifacts\app\docs -Recurse -Force -ErrorAction SilentlyContinue
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "artifacts\app\*" -DestinationPath $zip
          "PORTABLE_ZIP=$zip" | Out-File -Append ci-logs/build.txt -Encoding utf8
          Get-Item $zip | ForEach-Object { "ZIP_BYTES=$($_.Length)" | Out-File -Append ci-logs/build.txt -Encoding utf8 }

      - name: Build installer
        if: env.PUBLISH_EXIT == '0'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "installer\windows\ShikkhaDesk.iss" "/DMyAppVersion=$env:VERSION" 2>&1 | Tee-Object -FilePath ci-logs/installer.txt
            "ISCC_EXIT=$LASTEXITCODE" | Out-File -Append ci-logs/build.txt -Encoding utf8
          } else {
            "ISCC_EXIT=not-found" | Out-File -Append ci-logs/build.txt -Encoding utf8
          }

      - name: Upload release artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShikkhaDesk-artifacts
          path: |
            artifacts/release/*.exe
            artifacts/release/*.zip
          if-no-files-found: warn

      - name: Summarise
        if: always()
        shell: pwsh
        run: |
          $log = "ci-logs/build.txt"
          "=== errors ===" | Out-File -Append $log -Encoding utf8
          if (Test-Path ci-logs/compile.txt) {
            $errors = Select-String -Path ci-logs/compile.txt -Pattern ": error " |
              ForEach-Object { $_.Line } | Select-Object -Unique
            "ERROR_COUNT=$($errors.Count)" | Out-File -Append $log -Encoding utf8
            $errors | Select-Object -First 200 | ForEach-Object { $_ } | Out-File -Append $log -Encoding utf8
          }
          "=== installer ===" | Out-File -Append $log -Encoding utf8
          if (Test-Path ci-logs/installer.txt) {
            Get-Content ci-logs/installer.txt | Select-Object -First 60 | Out-File -Append $log -Encoding utf8
          } else { "no installer log" | Out-File -Append $log -Encoding utf8 }
          "=== warnings (first 20) ===" | Out-File -Append $log -Encoding utf8
          if (Test-Path ci-logs/compile.txt) {
            Select-String -Path ci-logs/compile.txt -Pattern ": warning " | Select-Object -First 20 |
              ForEach-Object { $_.Line } | Out-File -Append $log -Encoding utf8
          }
          "=== test summary ===" | Out-File -Append $log -Encoding utf8
          Get-ChildItem ci-logs -Filter test-*.txt -ErrorAction SilentlyContinue | ForEach-Object {
            "--- $($_.Name) ---" | Out-File -Append $log -Encoding utf8
            $lines = Get-Content $_.FullName
            "LINES=$($lines.Count)" | Out-File -Append $log -Encoding utf8
            if ($lines.Count -le 300) {
              $lines | Out-File -Append $log -Encoding utf8
            } else {
              ($lines | Select-String -Pattern "^  Failed |^  Error Message|^(Failed!|Passed!)|^Assert|^Total tests|^Expected:|^Actual:|^   (?!at )\\S") |
                Select-Object -First 150 | ForEach-Object { $_.Line } | Out-File -Append $log -Encoding utf8
            }
          }
          Get-Content $log | Write-Host

      - name: Publish results to PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = 'ci-logs/build.txt';
            let body = '';
            try { body = fs.readFileSync(p, 'utf8'); } catch (e) { body = 'no build log: ' + e.message; }
            if (body.length > 60000) body = body.slice(0, 60000) + '\n... (truncated)';
            const marker = '<!-- shikkhadesk-ci-report -->';
            const text = marker + '\n### ShikkhaDesk Windows CI — run ' + context.runId +
              '\n```\n' + body + '\n```';
            const comments = await github.rest.issues.listComments({
              issue_number: 1, owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: text
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: 1, owner: context.repo.owner, repo: context.repo.repo, body: text
              });
            }
